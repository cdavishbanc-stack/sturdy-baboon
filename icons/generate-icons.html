<!DOCTYPE html>
<html>
<head><title>HoldForte Icon Generator</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save Image As" to get your app icons.</p>

<h3>192x192</h3>
<canvas id="icon192" width="192" height="192"></canvas>

<h3>512x512</h3>
<canvas id="icon512" width="512" height="512"></canvas>

<script>
function drawIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  
  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, size, size);
  
  // "HF" text
  ctx.fillStyle = '#2563eb';
  ctx.font = `bold ${size * 0.45}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HF', size/2, size/2);
  
  // Small accent bar
  ctx.fillStyle = '#f59e0b';
  const barWidth = size * 0.4;
  const barHeight = size * 0.04;
  ctx.fillRect((size - barWidth)/2, size * 0.72, barWidth, barHeight);
}

drawIcon('icon192', 192);
drawIcon('icon512', 512);
</script>
</body>
</html>
